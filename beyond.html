    <!-- Applies the saved theme before the page draws, so it never flashes the wrong colors -->
    <script>
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") === "green" ? "green" : "blue");
    </script>
    <!-- Plain scripts for the intro screen and the travel map. They are not React: the React page
         calls into them (see src/beyond/TravelMap.jsx). Not deferred: gate.js hides the page before
         the first paint so the intro screen doesn't flash. Bump ?v= after editing one of these. -->
    <script src="./legacy/helpers.js?v=1"></script>
    <script src="./legacy/gate.js?v=1"></script>
    <script defer src="./legacy/world-dots.js?v=1"></script>
    <script defer src="./legacy/map-controls.js?v=1"></script>

    <script defer src="./legacy/globe.js?v=1"></script>
